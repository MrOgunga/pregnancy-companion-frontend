<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nerve Update</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #fffaf6;
      --pink: #e87b92;
      --ink: #2d1b2e;
      --muted: #766275;
      --line: rgba(45, 27, 46, 0.1);
      --serif: "Cormorant Garamond", serif;
      --sans: "DM Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(232, 123, 146, 0.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(227, 208, 244, 0.25), transparent 28%),
        var(--cream);
      color: var(--ink);
      font-family: var(--sans);
    }
    .shell {
      max-width: 1160px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 28px;
      text-decoration: none;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--pink);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      backdrop-filter: blur(10px);
    }
    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(71, 49, 74, 0.08);
      overflow: hidden;
      min-height: calc(100vh - 150px);
    }
    .state {
      padding: 52px 24px;
      text-align: center;
      max-width: 620px;
      margin: 0 auto;
    }
    .state h1 {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    .state p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }
    .loader {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px solid rgba(232, 123, 146, 0.16);
      border-top-color: var(--pink);
      margin: 0 auto 22px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-actions {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
    }
    .btn-primary {
      background: var(--pink);
      border-color: var(--pink);
      color: white;
    }
    iframe {
      display: none;
      width: 100%;
      min-height: calc(100vh - 150px);
      border: none;
      background: white;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="brand" href="/"><span class="dot"></span><span>Nerve</span></a>
      <div class="status">Private Weekly Update</div>
    </div>

    <div class="card">
      <div class="state" id="state">
        <div class="loader" id="loader"></div>
        <h1 id="title">Opening your update</h1>
        <p id="message">We’re loading your personalized weekly page now.</p>
      </div>
      <iframe id="updateFrame" title="Nerve Weekly Update"></iframe>
    </div>
  </div>

  <script>
    const LOOKUP_WEBHOOK_URL = 'https://taiyelolu.app.n8n.cloud/webhook/pregnancy-update-lookup';

    function getSlug() {
      const path = window.location.pathname.replace(/\/+$/, '');
      const parts = path.split('/').filter(Boolean);
      const pathSlug = parts.length > 1 ? parts[parts.length - 1] : '';
      const querySlug = new URLSearchParams(window.location.search).get('slug');
      return querySlug || pathSlug;
    }

    function showError(title, message) {
      const state = document.getElementById('state');
      document.getElementById('title').textContent = title;
      document.getElementById('message').innerHTML = message;
      const loader = document.getElementById('loader');
      if (loader) loader.remove();

      if (!document.getElementById('errorActions')) {
        const actions = document.createElement('div');
        actions.className = 'error-actions';
        actions.id = 'errorActions';
        actions.innerHTML = [
          '<a class="btn btn-primary" href="/">Back to site</a>',
          '<a class="btn" href="mailto:thebrandnerve@gmail.com">Contact support</a>'
        ].join('');
        state.appendChild(actions);
      }
    }

    async function loadUpdate() {
      const slug = getSlug();

      if (!slug || slug === 'my-update') {
        showError('Missing update link', 'This private page link is incomplete. Please reopen the email and try again.');
        return;
      }

      try {
        const res = await fetch(`${LOOKUP_WEBHOOK_URL}?slug=${encodeURIComponent(slug)}`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        if (!res.ok) {
          throw new Error(`Lookup failed with status ${res.status}`);
        }

        const data = await res.json();

        if (!data || !data.success || !data.html_content) {
          throw new Error('Update content was not found');
        }

        const frame = document.getElementById('updateFrame');
        frame.srcdoc = data.html_content;
        frame.style.display = 'block';
        document.getElementById('state').style.display = 'none';
        document.title = data.page_title || 'Nerve Update';
      } catch (error) {
        showError(
          'We couldn’t open this update',
          'The personalized page could not be loaded yet. This usually means the lookup webhook is missing, the slug does not exist, or the returned JSON is malformed.'
        );
      }
    }

    loadUpdate();
  </script>
</body>
</html>
