# Optional: deploy via GitHub Actions. The simpler path is Railway's native GitHub
# integration (auto-deploys on push). Use this only if you want Actions-driven deploys.
# Required repo secrets: RAILWAY_TOKEN (a project token), RAILWAY_SERVICE (service name).
name: Deploy to Railway

on:
  push:
    branches: [dev-shinzii, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - run: railway up --service "${{ secrets.RAILWAY_SERVICE }}" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
